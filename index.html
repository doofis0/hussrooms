<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | gruf</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/profiler.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">gruf</div>
      </div>
    </div>
<script src="Build/hussrooms.loader.js"></script>
<script>
  // Fetches a list of file parts and concatenates them into one Blob
  async function fetchAndConcat(urls, mimeType) {
    const buffers = [];
    for (const url of urls) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
      buffers.push(await res.arrayBuffer());
    }
    return new Blob(buffers, { type: mimeType });
  }

  async function startGame() {
    const dataParts = [
      "Build/hussrooms.data.part1",
      "Build/hussrooms.data.part2",
      "Build/hussrooms.data.part3",
      "Build/hussrooms.data.part4",
      "Build/hussrooms.data.part5",
    ];
    const wasmParts = [
      "Build/hussrooms.wasm.part1",
      "Build/hussrooms.wasm.part2",
      "Build/hussrooms.wasm.part3",
      "Build/hussrooms.wasm.part4",
    ];

    const [dataBlob, wasmBlob] = await Promise.all([
      fetchAndConcat(dataParts, "application/octet-stream"),
      fetchAndConcat(wasmParts, "application/wasm"),
    ]);

    const config = {
      dataUrl: URL.createObjectURL(dataBlob),
      frameworkUrl: "Build/hussrooms.framework.js",
      codeUrl: URL.createObjectURL(wasmBlob),
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompanyName",   // match what's already in your file
      productName: "hussrooms",
      productVersion: "1.0",
    };

    const canvas = document.querySelector("#unity-canvas"); // match your actual canvas id

    createUnityInstance(canvas, config, (progress) => {
      // optional: update a progress bar here
    }).then((unityInstance) => {
      console.log("Unity started");
    }).catch((message) => {
      alert(message);
    });
  }

  startGame();
</script>
  </body>
</html>
