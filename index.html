<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>hussrooms</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/hussrooms.loader.js"></script>
    <script>
      async function fetchAndConcat(urls, mimeType) {
        const buffers = [];
        for (const url of urls) {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
          buffers.push(await res.arrayBuffer());
        }
        return new Blob(buffers, { type: mimeType });
      }

      async function startGame() {
        const dataParts = [
          "Build/hussrooms.data.unityweb.part1",
          "Build/hussrooms.data.unityweb.part2",
          "Build/hussrooms.data.unityweb.part3",
          "Build/hussrooms.data.unityweb.part4",
          "Build/hussrooms.data.unityweb.part5",
        ];
        const wasmParts = [
          "Build/hussrooms.wasm.unityweb"
        ];

        const [dataBlob, wasmBlob] = await Promise.all([
          fetchAndConcat(dataParts, "application/octet-stream"),
          fetchAndConcat(wasmParts, "application/wasm"),
        ]);

        const config = {
          dataUrl: URL.createObjectURL(dataBlob),
          frameworkUrl: "Build/hussrooms.framework.js.unityweb",
          codeUrl: URL.createObjectURL(wasmBlob),
          streamingAssetsUrl: "StreamingAssets",
          companyName: "huss productions",
          productName: "hussrooms",
          productVersion: "1.0",
          devicePixelRatio: window.devicePixelRatio,
        };

        const canvas = document.querySelector("#unity-canvas");

        function resizeCanvas() {
          canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
          canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        createUnityInstance(canvas, config).catch((message) => {
          alert(message);
        });
      }

      startGame();
    </script>
  </body>
</html>
